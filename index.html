<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>SINGIFY</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #search {
            display: block;
            margin: 20px auto;
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #fff;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        a.song-link {
            font-weight: bold;
            font-size: 18px;
            color: #0066cc;
            text-decoration: none;
        }
        a.song-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>SINGIFY</h1>
    <input type="text" id="search" placeholder="Hledat píseň nebo interpreta...">
    <ul id="songList"></ul>

    <script>
        async function loadSongs() {
            const response = await fetch('https://api.github.com/repos/martinkutlak/singify/contents/pdf');
            const data = await response.json();
            const songList = document.getElementById('songList');

            const songs = data.filter(file => file.name.endsWith('.pdf')).map(file => {
                const parts = file.name.replace('.pdf', '').split('__');
                const id = parts[0];
                const name = parts[1] || '';
                const artist = parts[2] || '';

                function capitalizeWords(str) {
                    return str.split(/[\s_]+/).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                }

                return {
                    id: id,
                    title: capitalizeWords(name),
                    artist: capitalizeWords(artist),
                    url: file.download_url
                };
            });

            function displaySongs(filteredSongs) {
                songList.innerHTML = '';
                filteredSongs.forEach(song => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.className = 'song-link';
                    link.textContent = `${song.id} - ${song.title} - ${song.artist}`;
                    link.href = song.url;
                    link.target = '_blank';  // otevře PDF v nové záložce
                    li.appendChild(link);
                    songList.appendChild(li);
                });
            }

            displaySongs(songs);

            document.getElementById('search').addEventListener('input', e => {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = songs.filter(song => 
                    song.title.toLowerCase().includes(searchTerm) ||
                    song.artist.toLowerCase().includes(searchTerm)
                );
                displaySongs(filtered);
            });
        }

        loadSongs();
    </script>
</body>
</html>
