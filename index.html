<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINGIFY</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #333; }
    input { width: 100%; padding: 10px; margin-bottom: 20px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    ul { list-style-type: none; padding: 0; max-width: 600px; margin: 0 auto; }
    li { background: #fff; margin-bottom: 10px; padding: 12px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s; }
    li:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
    a { text-decoration: none; color: #007acc; font-weight: bold; display: block; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>SINGIFY</h1>
  <input type="text" id="search" placeholder="Hledat...">
  <ul id="pdfList"></ul>

  <script>
    const pdfListElement = document.getElementById('pdfList');
    const searchInput = document.getElementById('search');

    function capitalizeWords(str) {
      return str.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    async function fetchPDFs() {
      const response = await fetch('https://api.github.com/repos/martinkutlak/singify/contents/pdf');
      const data = await response.json();

      const sortedData = data.sort((a, b) => {
        const idA = parseInt(a.name.split('_')[0], 10);
        const idB = parseInt(b.name.split('_')[0], 10);
        return idA - idB;
      });

      displayPDFs(sortedData);
    }

    function displayPDFs(pdfs) {
      pdfListElement.innerHTML = '';
      pdfs.forEach(pdf => {
        const parts = pdf.name.replace('.pdf', '').split('__');
        if (parts.length === 2) {
          const idAndSong = parts[0].split('_');
          const id = idAndSong[0];
          const songName = capitalizeWords(idAndSong.slice(1).join(' '));
          const artist = capitalizeWords(parts[1].replace(/_/g, ' '));
          const li = document.createElement('li');
          li.innerHTML = `<a href="${pdf.download_url}" target="_blank">${id} - ${songName} - ${artist}</a>`;
          pdfListElement.appendChild(li);
        }
      });
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const items = pdfListElement.querySelectorAll('li');
      items.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    });

    fetchPDFs();
  </script>

</body>
</html>
