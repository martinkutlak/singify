<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singify PDF List</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { width: 100%; padding: 8px; margin-bottom: 20px; font-size: 16px; }
    ul { list-style-type: none; padding: 0; }
    li { margin-bottom: 8px; }
    a { text-decoration: none; color: #007acc; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Seznam písní</h1>
  <input type="text" id="search" placeholder="Hledat...">
  <ul id="pdfList"></ul>

  <script>
    const pdfListElement = document.getElementById('pdfList');
    const searchInput = document.getElementById('search');

    async function fetchPDFs() {
      const response = await fetch('https://api.github.com/repos/martinkutlak/singify/contents/pdf');
      const data = await response.json();

      // Seřazení podle ID (číslo na začátku názvu souboru)
      const sortedData = data.sort((a, b) => {
        const idA = parseInt(a.name.split('_')[0], 10);
        const idB = parseInt(b.name.split('_')[0], 10);
        return idA - idB;
      });

      displayPDFs(sortedData);
    }

    function displayPDFs(pdfs) {
      pdfListElement.innerHTML = '';
      pdfs.forEach(pdf => {
        // Rozdělení názvu souboru na ID, název písně a interpreta
        const parts = pdf.name.replace('.pdf', '').split('__');
        if (parts.length === 2) {
          const idAndSong = parts[0].split('_');
          const id = idAndSong[0];
          const songName = idAndSong.slice(1).join('_').replace(/_/g, ' ');
          const artist = parts[1].replace(/_/g, ' ');
          const li = document.createElement('li');
          li.innerHTML = `<a href="${pdf.download_url}" target="_blank">${id} - ${songName} | ${artist}</a>`;
          pdfListElement.appendChild(li);
        }
      });
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const items = pdfListElement.querySelectorAll('li');
      items.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    });

    fetchPDFs();
  </script>

</body>
</html>
